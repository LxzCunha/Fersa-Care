# FERSA CARE — serviços para desenvolvimento e demonstração.
#
#   Só o banco (para programar com npm run dev):   docker compose up -d db
#   Portal completo em http://localhost:3000:       docker compose up --build
#
# O banco usa a imagem do PostgreSQL com a extensão pgvector já instalada.
# As migrações a habilitam (0002) e criam a base vetorial do assistente com RAG
# (tabela documento_trechos, 0003), então um PostgreSQL comum não serve.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fersa
      POSTGRES_PASSWORD: fersa
      POSTGRES_DB: fersa_care
    ports:
      # Porta 5432 ocupada por outro PostgreSQL na máquina? Suba com outra:
      #   DB_PORTA=5433 docker compose up -d db   (e ajuste a porta no DATABASE_URL)
      - "${DB_PORTA:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      # Scripts executados só na primeira inicialização (cria o banco de testes).
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fersa -d fersa_care"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        VITE_SUPORTE_WHATSAPP: "5541999999999"
        VITE_SUPORTE_EMAIL: "suporte@fersacare.com.br"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fersa:fersa@db:5432/fersa_care
      # Valor só para rodar localmente. Em produção defina JWT_SEGREDO num arquivo .env.
      JWT_SEGREDO: ${JWT_SEGREDO:-somente-para-desenvolvimento-local-troque-em-producao-0001}
      JWT_EXPIRACAO_HORAS: "8"
      COOKIE_SEGURO: "false" # use "true" quando o site estiver em HTTPS
      UPLOAD_LIMITE_MB: "200"
      ADMIN_EMAIL: admin@fersacare.com.br
      ADMIN_SENHA: ${ADMIN_SENHA:-Admin@123}
      # Cria clientes, produtos e documentos fictícios para demonstração.
      SEED_EXEMPLOS: ${SEED_EXEMPLOS:-true}
    ports:
      - "3000:3000"
    volumes:
      - arquivos:/app/uploads

  # Fase 2 (assistente com RAG): descomente para rodar o modelo localmente.
  # Depois: docker compose exec ollama ollama pull qwen3:14b
  # ollama:
  #   image: ollama/ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - modelos-ollama:/root/.ollama

volumes:
  dados-postgres:
  arquivos:
  # modelos-ollama:
