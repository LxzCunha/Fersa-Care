# As migrações exigem a extensão pgvector: um PostgreSQL comum não serve.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fersa
      POSTGRES_PASSWORD: fersa
      POSTGRES_DB: fersa_care
    ports:
      - "${DB_PORTA:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      # Só na primeira inicialização do volume: cria o banco de testes.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fersa -d fersa_care"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        VITE_SUPORTE_WHATSAPP: "5541999999999"
        VITE_SUPORTE_EMAIL: "suporte@fersacare.com.br"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fersa:fersa@db:5432/fersa_care
      # Valor só para rodar localmente. Em produção defina JWT_SEGREDO num arquivo .env.
      JWT_SEGREDO: ${JWT_SEGREDO:-somente-para-desenvolvimento-local-troque-em-producao-0001}
      JWT_EXPIRACAO_HORAS: "8"
      COOKIE_SEGURO: "false" # use "true" quando o site estiver em HTTPS
      UPLOAD_LIMITE_MB: "200"
      ADMIN_EMAIL: admin@fersacare.com.br
      ADMIN_SENHA: ${ADMIN_SENHA:-Admin@123}
      SEED_EXEMPLOS: ${SEED_EXEMPLOS:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "3000:3000"
    volumes:
      - arquivos:/app/uploads

  # No Mac, o Ollama no Docker não usa a GPU: prefira o app nativo com
  # OLLAMA_URL=http://host.docker.internal:11434 docker compose up app
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    profiles: ["ia"]
    ports:
      - "11434:11434"
    volumes:
      - modelos-ollama:/root/.ollama

volumes:
  dados-postgres:
  arquivos:
  modelos-ollama:
