# Análise estática de segurança (CodeQL) do código TypeScript da API e do site.
# Os alertas aparecem em Security → Code scanning no GitHub.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 6 * * 1' # toda segunda, 06:27 UTC (pega vulnerabilidades novas sem mudança de código)

permissions:
  contents: read

jobs:
  analisar:
    name: Analisar (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
