# Integração contínua: roda em todo push na main e em todo pull request.
# Cada pacote (API e site) é verificado em paralelo; a imagem Docker só é
# construída depois que os dois passam.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do workflow só lê o repositório (princípio do menor privilégio).
permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # Mesmo banco do docker-compose (PostgreSQL 17 + pgvector), só para os testes.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fersa
          POSTGRES_PASSWORD: fersa
          POSTGRES_DB: fersa_care_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fersa -d fersa_care_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TESTE: postgres://fersa:fersa@localhost:5432/fersa_care_teste
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Falha o build se alguma dependência de produção tiver vulnerabilidade alta ou crítica.
      - run: npm audit --omit=dev --audit-level=high

  site:
    name: Site · lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  imagem:
    name: Imagem Docker
    needs: [api, site]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Constrói a imagem de produção
        run: docker build --tag fersa-care:${{ github.sha }} .
