openapi: 3.1.0
info:
  title: API FERSA CARE
  version: 1.0.0
  description: |
    API REST do portal de pós-venda FERSA CARE.

    **Níveis de acesso**
    - **Visitante** (sem login): vê documentos `PUBLICO`.
    - **Usuário** (cliente com login ativo): vê `PUBLICO`, `AUTENTICADO` e os `RESTRITO` liberados para ele.
    - **Administrador**: vê e gerencia tudo em `/api/admin`.

    **Como autenticar aqui no Swagger:** chame `POST /api/auth/entrar`. O navegador guarda o
    cookie de sessão automaticamente. Se preferir, copie o `token` da resposta e use o botão
    **Authorize** (Bearer).

    **Erros** sempre seguem o formato `{ "erro": { "codigo", "mensagem", "detalhes" } }`.
    Toda resposta traz o cabeçalho `X-Request-Id`: informe-o ao suporte para localizar a
    requisição nos logs.

    **Segurança**
    - Requisições que alteram dados (POST, PUT, PATCH, DELETE) vindas de um navegador
      precisam partir do próprio portal (cabeçalhos `Origin`/`Sec-Fetch-Site`); de outro site
      recebem `403 ORIGEM_NAO_PERMITIDA`. Clientes sem navegador (curl, apps) não são afetados.
    - O token de sessão perde a validade quando a senha é trocada ou redefinida, quando a
      conta é desativada e em "sair dos outros dispositivos".
    - Login: no máximo 10 tentativas erradas por IP e 5 por conta a cada 15 minutos (`429`).
    - Uploads: o conteúdo precisa bater com a extensão (`400 CONTEUDO_NAO_CONFERE`).
servers:
  - url: /
tags:
  - name: Autenticação
  - name: Documentos
    description: Biblioteca pública — cada um recebe só o que pode ver.
  - name: Produtos
    description: Catálogo de peças — público; peças fora do catálogo não aparecem.
  - name: Categorias
  - name: Admin - Painel
  - name: Admin - Documentos
  - name: Admin - Usuários
  - name: Admin - Produtos
  - name: Admin - Categorias
  - name: Assistente
    description: Assistente técnico (bolinha de chat) com RAG; responde só sobre peças e produtos FERSA
  - name: Admin - Chamados
  - name: Admin - Auditoria
    description: Trilha de auditoria (logins, senhas e alterações feitas pelo administrador). Só leitura.
  - name: Saúde
    description: Verificações para Docker, Kubernetes e balanceadores
security:
  - cookieSessao: []
  - bearer: []
  - {}

paths:
  /api/saude:
    get:
      tags: [Saúde]
      summary: O processo está de pé (liveness). Não consulta o banco.
      security: []
      responses:
        '200':
          description: OK

  /api/saude/pronto:
    get:
      tags: [Saúde]
      summary: Pode receber tráfego (readiness)
      description: |
        Confere o banco (indispensável) e o Ollama do assistente (opcional). Sem o assistente a
        API responde `degradado`, mas continua pronta.
      security: []
      responses:
        '200':
          description: Pronta (`ok` ou `degradado`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prontidao' }
        '503':
          description: Sem banco de dados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prontidao' }

  /api/auth/entrar:
    post:
      tags: [Autenticação]
      summary: Entrar (login)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email, example: admin@fersacare.com.br }
                senha: { type: string, example: Admin@123 }
      responses:
        '200':
          description: Login feito. Grava o cookie `fersa_sessao` (httpOnly) e devolve o token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario: { $ref: '#/components/schemas/Usuario' }
                  token: { type: string }
        '401': { $ref: '#/components/responses/Erro' }
        '403':
          description: Cadastro pendente (`CADASTRO_PENDENTE`) ou conta inativa (`CONTA_INATIVA`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '429': { $ref: '#/components/responses/Erro' }

  /api/auth/sair:
    post:
      tags: [Autenticação]
      summary: Sair (apaga o cookie de sessão)
      responses:
        '204': { description: Sessão encerrada }

  /api/auth/solicitar-acesso:
    post:
      tags: [Autenticação]
      summary: Cliente pede acesso (fica PENDENTE até um admin aprovar)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome: { type: string, example: Carlos Mendes }
                email: { type: string, format: email }
                senha: { type: string, minLength: 8, description: Pelo menos 8 caracteres, com letras e números }
                empresa: { type: string, nullable: true, example: Auto Center Exemplo }
                telefone: { type: string, nullable: true }
      responses:
        '201':
          description: Solicitação registrada
        '400': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }

  /api/auth/eu:
    get:
      tags: [Autenticação]
      summary: Quem está logado (visitante recebe usuario null)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    oneOf:
                      - $ref: '#/components/schemas/Usuario'
                      - type: 'null'
    put:
      tags: [Autenticação]
      summary: Atualiza o próprio perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string }
                empresa: { type: string, nullable: true }
                telefone: { type: string, nullable: true }
      responses:
        '200': { description: Perfil atualizado }
        '401': { $ref: '#/components/responses/Erro' }

  /api/auth/eu/senha:
    put:
      tags: [Autenticação]
      summary: Troca a própria senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senhaAtual, novaSenha]
              properties:
                senhaAtual: { type: string }
                novaSenha: { type: string, minLength: 8 }
      description: |
        Os logins da conta em outros dispositivos deixam de valer. Esta sessão recebe um cookie
        novo (quem usa `Authorization: Bearer` precisa entrar de novo).
      responses:
        '204': { description: Senha alterada (com um novo cookie de sessão) }
        '400': { $ref: '#/components/responses/Erro' }

  /api/auth/eu/encerrar-outras-sessoes:
    post:
      tags: [Autenticação]
      summary: Sai da conta em todos os outros dispositivos
      description: Invalida todos os tokens da conta e devolve um cookie novo para esta sessão.
      responses:
        '204': { description: Sessões encerradas (com um novo cookie de sessão) }
        '401': { $ref: '#/components/responses/Erro' }

  /api/documentos:
    get:
      tags: [Documentos]
      summary: Lista os documentos que quem chama pode ver
      parameters:
        - $ref: '#/components/parameters/Busca'
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoDocumento' } }
        - { name: segmento, in: query, schema: { $ref: '#/components/schemas/Segmento' } }
        - { name: produtoId, in: query, schema: { type: string, format: uuid } }
        - { name: idioma, in: query, schema: { type: string, enum: [pt-BR, es, en] } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de documentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDocumentos' }

  /api/documentos/resumo:
    get:
      tags: [Documentos]
      summary: Dados da página inicial (quantidade por tipo e recentes)
      responses:
        '200': { description: OK }

  /api/documentos/{id}:
    get:
      tags: [Documentos]
      summary: Detalhe de um documento (registra uma visualização)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '401':
          description: Visitante tentando abrir documento que exige login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404':
          description: Não existe ou o usuário não tem permissão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /api/documentos/{id}/arquivo:
    get:
      tags: [Documentos]
      summary: Abre ou baixa o conteúdo (arquivo ou redirecionamento para o link)
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: download, in: query, description: '1 para forçar o download', schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: Conteúdo do arquivo (aceita Range para vídeos) }
        '206': { description: Parte do arquivo (Range) }
        '302': { description: Documento é um link externo }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }

  /api/documentos/{id}/capa:
    get:
      tags: [Documentos]
      summary: Capa do documento (miniatura WebP de 480 px de largura)
      description: >-
        Use a `capaUrl` devolvida pela API (o `?v=` muda a cada edição). Mesma permissão do documento:
        401 para visitante em documento que exige login, 404 sem permissão ou sem capa.
        Capas de documentos públicos podem ficar em cache compartilhado; as demais, só no navegador.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Imagem WebP
          content:
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }

  /api/produtos:
    get:
      tags: [Produtos]
      summary: Catálogo de produtos ativos
      description: A busca procura no código (sem espaços/hífens), nome, aplicação, descrição e nome da categoria. Filtros de medida deixam de fora peças sem a medida cadastrada.
      parameters:
        - $ref: '#/components/parameters/Busca'
        - { name: segmento, in: query, schema: { $ref: '#/components/schemas/Segmento' } }
        - { name: categoriaId, in: query, schema: { type: string, format: uuid } }
        - { name: internoMin, in: query, description: Ø interno mínimo (mm), schema: { type: number } }
        - { name: internoMax, in: query, description: Ø interno máximo (mm), schema: { type: number } }
        - { name: externoMin, in: query, description: Ø externo mínimo (mm), schema: { type: number } }
        - { name: externoMax, in: query, description: Ø externo máximo (mm), schema: { type: number } }
        - { name: larguraMin, in: query, description: Largura mínima (mm), schema: { type: number } }
        - { name: larguraMax, in: query, description: Largura máxima (mm), schema: { type: number } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { description: Página de produtos }

  /api/produtos/{id}:
    get:
      tags: [Produtos]
      summary: Produto com os documentos visíveis para quem chama
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Erro' }

  /api/produtos/{id}/imagem:
    get:
      tags: [Produtos]
      summary: Foto da peça
      description: Use a `imagemUrl` devolvida pela API (o `?v=` muda a cada edição). Peças fora do catálogo só mostram a foto para administradores.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Imagem PNG, JPG ou WebP
          content:
            image/*: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/categorias:
    get:
      tags: [Categorias]
      summary: Categorias com peças ativas no catálogo (com a contagem)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Categoria' } }

  /api/admin/painel:
    get:
      tags: [Admin - Painel]
      summary: Números do painel (documentos, usuários, visualizações)
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Erro' }
        '403': { $ref: '#/components/responses/Erro' }

  /api/admin/documentos:
    get:
      tags: [Admin - Documentos]
      summary: Lista todos os documentos (inclui rascunhos)
      parameters:
        - $ref: '#/components/parameters/Busca'
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoDocumento' } }
        - { name: visibilidade, in: query, schema: { $ref: '#/components/schemas/Visibilidade' } }
        - { name: publicado, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { description: Página de documentos }
    post:
      tags: [Admin - Documentos]
      summary: Cadastra documento (arquivo e/ou capa via multipart, ou link via JSON)
      description: >-
        Sem `capa`, a capa é gerada da 1ª página do PDF ou da própria imagem (outros formatos ficam sem capa).
        Uma capa enviada vale até `removerCapa`, mesmo que o arquivo seja trocado.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dados]
              properties:
                dados:
                  type: string
                  description: JSON com os campos de DadosDocumento
                  example: '{"titulo":"Guia de montagem","tipo":"MANUAL","visibilidade":"PUBLICO","origem":"ARQUIVO"}'
                arquivo:
                  type: string
                  format: binary
                capa:
                  type: string
                  format: binary
                  description: Capa própria (PNG, JPG ou WebP, até 5 MB). É guardada reduzida, em WebP.
          application/json:
            schema: { $ref: '#/components/schemas/DadosDocumento' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoAdmin' }
        '400': { $ref: '#/components/responses/Erro' }
        '413': { $ref: '#/components/responses/Erro' }

  /api/admin/documentos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin - Documentos]
      summary: Detalhe com usuários liberados e total de visualizações
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoAdmin' }
    put:
      tags: [Admin - Documentos]
      summary: Edita documento (envie novo arquivo para substituir; sem arquivo mantém o atual)
      description: >-
        Trocar o arquivo refaz a capa automática, mas não substitui uma capa enviada pelo admin.
        `removerCapa` apaga a capa enviada e volta para a automática.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dados]
              properties:
                dados: { type: string }
                arquivo: { type: string, format: binary }
                capa: { type: string, format: binary }
          application/json:
            schema: { $ref: '#/components/schemas/DadosDocumento' }
      responses:
        '200': { description: Atualizado }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
    delete:
      tags: [Admin - Documentos]
      summary: Exclui documento e arquivo
      responses:
        '204': { description: Excluído }
        '404': { $ref: '#/components/responses/Erro' }

  /api/admin/usuarios:
    get:
      tags: [Admin - Usuários]
      summary: Lista usuários (pendentes primeiro) com contagem por situação
      parameters:
        - $ref: '#/components/parameters/Busca'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusUsuario' } }
        - { name: perfil, in: query, schema: { $ref: '#/components/schemas/Perfil' } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { description: OK }
    post:
      tags: [Admin - Usuários]
      summary: Cadastra usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DadosUsuario'
                - type: object
                  required: [senha]
                  properties:
                    senha: { type: string, minLength: 8 }
      responses:
        '201': { description: Criado }
        '409': { $ref: '#/components/responses/Erro' }

  /api/admin/usuarios/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin - Usuários]
      summary: Detalhe com documentos restritos liberados
      responses:
        '200': { description: OK }
    put:
      tags: [Admin - Usuários]
      summary: Edita usuário (novaSenha opcional)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DadosUsuario'
                - type: object
                  properties:
                    novaSenha: { type: string, nullable: true }
      responses:
        '200': { description: Atualizado }
        '403': { $ref: '#/components/responses/Erro' }
    delete:
      tags: [Admin - Usuários]
      summary: Exclui usuário
      responses:
        '204': { description: Excluído }
        '403': { $ref: '#/components/responses/Erro' }

  /api/admin/usuarios/{id}/status:
    patch:
      tags: [Admin - Usuários]
      summary: Aprova, recusa ou desativa (altera a situação)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/StatusUsuario' }
      responses:
        '200': { description: Situação alterada }
        '403': { $ref: '#/components/responses/Erro' }

  /api/admin/produtos:
    get:
      tags: [Admin - Produtos]
      summary: Lista produtos (inclui inativos)
      parameters:
        - $ref: '#/components/parameters/Busca'
        - { name: segmento, in: query, schema: { $ref: '#/components/schemas/Segmento' } }
        - { name: ativo, in: query, schema: { type: boolean } }
        - { name: categoriaId, in: query, schema: { type: string, format: uuid } }
        - { name: internoMin, in: query, description: Ø interno mínimo (mm), schema: { type: number } }
        - { name: internoMax, in: query, description: Ø interno máximo (mm), schema: { type: number } }
        - { name: externoMin, in: query, description: Ø externo mínimo (mm), schema: { type: number } }
        - { name: externoMax, in: query, description: Ø externo máximo (mm), schema: { type: number } }
        - { name: larguraMin, in: query, description: Largura mínima (mm), schema: { type: number } }
        - { name: larguraMax, in: query, description: Largura máxima (mm), schema: { type: number } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { description: OK }
    post:
      tags: [Admin - Produtos]
      summary: Cadastra produto (com foto via multipart ou só os dados via JSON)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dados]
              properties:
                dados:
                  type: string
                  description: JSON com os campos de DadosProduto
                  example: '{"codigo":"30205","nome":"Rolamento de rolos cônicos","segmento":"LEVE"}'
                imagem:
                  type: string
                  format: binary
                  description: Foto da peça (PNG, JPG ou WebP, até 5 MB)
          application/json:
            schema: { $ref: '#/components/schemas/DadosProduto' }
      responses:
        '201': { description: Criado }
        '409': { $ref: '#/components/responses/Erro' }

  /api/admin/produtos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin - Produtos]
      summary: Detalhe do produto
      responses:
        '200': { description: OK }
    put:
      tags: [Admin - Produtos]
      summary: Edita produto (foto nova via multipart; sem foto, a atual é mantida)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dados]
              properties:
                dados:
                  type: string
                  description: JSON com os campos de DadosProduto
                  example: '{"codigo":"30205","nome":"Rolamento de rolos cônicos","segmento":"LEVE"}'
                imagem:
                  type: string
                  format: binary
                  description: Foto da peça (PNG, JPG ou WebP, até 5 MB)
          application/json:
            schema: { $ref: '#/components/schemas/DadosProduto' }
      responses:
        '200': { description: Atualizado }
    delete:
      tags: [Admin - Produtos]
      summary: Exclui produto (os documentos continuam existindo)
      responses:
        '204': { description: Excluído }

  /api/admin/categorias:
    get:
      tags: [Admin - Categorias]
      summary: Lista todas as categorias com a quantidade de peças
      parameters: [{ $ref: '#/components/parameters/Busca' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Categoria' } }
    post:
      tags: [Admin - Categorias]
      summary: Cadastra categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DadosCategoria' }
      responses:
        '201': { description: Criada }
        '409': { $ref: '#/components/responses/Erro' }

  /api/admin/categorias/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin - Categorias]
      summary: Detalhe da categoria
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [Admin - Categorias]
      summary: Edita categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DadosCategoria' }
      responses:
        '200': { description: Atualizada }
        '409': { $ref: '#/components/responses/Erro' }
    delete:
      tags: [Admin - Categorias]
      summary: Exclui categoria (as peças continuam, sem categoria)
      responses:
        '204': { description: Excluída }

  /api/assistente/perguntas:
    post:
      tags: [Assistente]
      summary: Pergunta ao assistente técnico (resposta em Server-Sent Events)
      description: >-
        A resposta chega aos pedaços como `text/event-stream`. Eventos: `conversa` ({ conversaId }, guarde para continuar),
        `texto` ({ texto }, um pedaço), `fim` ({ mensagemId, fontes, encaminhamento, chamado }) e `erro` ({ mensagem }).
        A busca usa só documentos que quem pergunta pode abrir (mesma regra da biblioteca) e a ficha das peças citadas pelo código.
        `encaminhamento`: NENHUM; SUGERIR_CHAMADO (1ª reclamação ou IA fora do ar); PEDIR_CONTATO (visitante insistiu ou pediu atendente:
        envie o contato em /api/assistente/chamados); CHAMADO_ABERTO (cliente com login: o chamado já foi aberto).
        Pergunta inválida, conversa inexistente e limite de perguntas respondem antes do streaming, em JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pergunta]
              properties:
                pergunta: { type: string, minLength: 2, maxLength: 1000, example: Como medir a folga axial do cubo de roda? }
                conversaId: { type: string, format: uuid, description: Continua uma conversa já começada }
      responses:
        '200':
          description: Eventos da resposta
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: conversa
                data: {"tipo":"conversa","conversaId":"..."}

                event: texto
                data: {"tipo":"texto","texto":"Meça com relógio comparador [1]."}

                event: fim
                data: {"tipo":"fim","mensagemId":"...","fontes":[{"tipo":"DOCUMENTO","id":"...","titulo":"Guia","numero":1}],"encaminhamento":"NENHUM","chamado":null}
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '429': { $ref: '#/components/responses/Erro' }

  /api/assistente/conversas/{id}:
    get:
      tags: [Assistente]
      summary: Conversa com as mensagens (para retomar depois de recarregar a página)
      description: Só quem começou a conversa (ou qualquer um com o id, se foi um visitante).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  mensagens: { type: array, items: { $ref: '#/components/schemas/MensagemDoAssistente' } }
                  chamado: { type: object, nullable: true, properties: { numero: { type: integer } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/assistente/chamados:
    post:
      tags: [Assistente]
      summary: Abre o chamado de suporte técnico com a conversa
      description: >-
        Com login, usa nome, e-mail e telefone da conta. Visitante informa nome e e-mail ou telefone.
        Cada conversa vira no máximo um chamado (repetir devolve o mesmo número).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversaId]
              properties:
                conversaId: { type: string, format: uuid }
                nome: { type: string }
                email: { type: string, format: email }
                telefone: { type: string }
      responses:
        '201':
          description: Chamado aberto
          content:
            application/json:
              schema:
                type: object
                properties:
                  numero: { type: integer, example: 12 }
                  mensagem: { type: string }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }

  /api/admin/documentos/{id}/indexar:
    post:
      tags: [Admin - Documentos]
      summary: O assistente lê o documento de novo (em segundo plano)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Indexação agendada }
        '404': { $ref: '#/components/responses/Erro' }

  /api/admin/chamados:
    get:
      tags: [Admin - Chamados]
      summary: Chamados de suporte, mais novos primeiro, com a contagem por situação
      parameters:
        - $ref: '#/components/parameters/Busca'
        - { name: status, in: query, schema: { type: string, enum: [ABERTO, EM_ATENDIMENTO, RESOLVIDO] } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de chamados, com `porStatus`
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens: { type: array, items: { $ref: '#/components/schemas/Chamado' } }
                  total: { type: integer }
                  pagina: { type: integer }
                  porPagina: { type: integer }
                  totalPaginas: { type: integer }
                  porStatus: { type: object, additionalProperties: { type: integer } }

  /api/admin/auditoria:
    get:
      tags: [Admin - Auditoria]
      summary: Eventos da trilha de auditoria, mais recentes primeiro
      parameters:
        - $ref: '#/components/parameters/Busca'
        - name: grupo
          in: query
          description: ACESSOS (logins, senhas, sessões) ou ALTERACOES (mudanças feitas no cadastro)
          schema: { type: string, enum: [ACESSOS, ALTERACOES] }
        - { name: acao, in: query, schema: { $ref: '#/components/schemas/AcaoDeAuditoria' } }
        - { name: autorId, in: query, schema: { type: string, format: uuid } }
        - { name: alvoTipo, in: query, schema: { type: string, enum: [USUARIO, DOCUMENTO, PRODUTO, CATEGORIA, CHAMADO] } }
        - { name: alvoId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens: { type: array, items: { $ref: '#/components/schemas/EventoDeAuditoria' } }
                  total: { type: integer }
                  pagina: { type: integer }
                  porPagina: { type: integer }
                  totalPaginas: { type: integer }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '403': { $ref: '#/components/responses/Erro' }

  /api/admin/chamados/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin - Chamados]
      summary: Chamado com a conversa inteira
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Chamado'
                  - type: object
                    properties:
                      conversa: { type: array, items: { $ref: '#/components/schemas/MensagemDoAssistente' } }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      tags: [Admin - Chamados]
      summary: Muda a situação e a anotação interna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ABERTO, EM_ATENDIMENTO, RESOLVIDO] }
                observacao: { type: string, nullable: true }
      responses:
        '200': { description: Atualizado }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }

components:
  securitySchemes:
    cookieSessao:
      type: apiKey
      in: cookie
      name: fersa_sessao
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Busca:
      name: busca
      in: query
      description: Texto livre. Ignora acentos; códigos são comparados sem espaços e hífens.
      schema: { type: string }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: porPagina
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Erro:
      description: Erro
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }

  schemas:
    Prontidao:
      type: object
      properties:
        status: { type: string, enum: [ok, degradado, indisponivel] }
        verificacoes:
          type: object
          properties:
            banco: { type: string, enum: [ok, falhou] }
            assistente: { type: string, enum: [ok, indisponivel] }
        horario: { type: string, format: date-time }
    AcaoDeAuditoria:
      type: string
      enum:
        - LOGIN
        - LOGIN_RECUSADO
        - ACESSO_SOLICITADO
        - SENHA_ALTERADA
        - SESSOES_ENCERRADAS
        - USUARIO_CRIADO
        - USUARIO_ALTERADO
        - USUARIO_STATUS_ALTERADO
        - USUARIO_EXCLUIDO
        - DOCUMENTO_CRIADO
        - DOCUMENTO_ALTERADO
        - DOCUMENTO_EXCLUIDO
        - PRODUTO_CRIADO
        - PRODUTO_ALTERADO
        - PRODUTO_EXCLUIDO
        - CATEGORIA_CRIADA
        - CATEGORIA_ALTERADA
        - CATEGORIA_EXCLUIDA
        - CHAMADO_ALTERADO
    EventoDeAuditoria:
      type: object
      properties:
        id: { type: string, format: uuid }
        acao: { $ref: '#/components/schemas/AcaoDeAuditoria' }
        autor:
          type: [object, 'null']
          description: Quem fez (null em ações de visitantes, como login recusado)
          properties:
            id: { type: [string, 'null'], format: uuid }
            nome: { type: string }
        alvo:
          type: [object, 'null']
          properties:
            tipo: { type: string, enum: [USUARIO, DOCUMENTO, PRODUTO, CATEGORIA, CHAMADO] }
            id: { type: string, format: uuid }
            rotulo: { type: string, description: 'Título, nome ou código no momento do evento' }
        detalhes:
          type: object
          description: 'O que mudou: nomes dos campos, situação de/para, acesso liberado/retirado, motivo da recusa. Nunca valores de senha.'
        ip: { type: [string, 'null'] }
        requisicaoId: { type: [string, 'null'], description: 'O X-Request-Id da requisição' }
        criadoEm: { type: string, format: date-time }
    MensagemDoAssistente:
      type: object
      properties:
        id: { type: string, format: uuid }
        papel: { type: string, enum: [USUARIO, ASSISTENTE] }
        conteudo: { type: string }
        fontes:
          type: array
          items:
            type: object
            properties:
              tipo: { type: string, enum: [DOCUMENTO, PRODUTO] }
              id: { type: string, format: uuid }
              titulo: { type: string }
              numero: { type: integer, description: 'Número citado no texto, como [1]' }
        insatisfacao: { type: boolean, description: A pessoa reclamou que a resposta não ajudou }
        criadoEm: { type: string, format: date-time }
    Chamado:
      type: object
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer }
        nome: { type: string }
        email: { type: string, nullable: true }
        telefone: { type: string, nullable: true }
        resumo: { type: string, description: As perguntas da conversa }
        status: { type: string, enum: [ABERTO, EM_ATENDIMENTO, RESOLVIDO] }
        observacao: { type: string, nullable: true }
        clienteCadastrado: { type: boolean }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    Erro:
      type: object
      properties:
        erro:
          type: object
          properties:
            codigo: { type: string, example: NAO_ENCONTRADO }
            mensagem: { type: string, example: Documento não encontrado. }
            detalhes:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensagem: { type: string }
    Perfil:
      type: string
      enum: [ADMIN, USUARIO]
    StatusUsuario:
      type: string
      enum: [PENDENTE, ATIVO, INATIVO]
    Visibilidade:
      type: string
      enum: [PUBLICO, AUTENTICADO, RESTRITO]
      description: 'PUBLICO: todos; AUTENTICADO: qualquer usuário logado; RESTRITO: só os usuários escolhidos'
    TipoDocumento:
      type: string
      enum: [MANUAL, CATALOGO, VIDEO, TREINAMENTO, FICHA_TECNICA, BOLETIM, OUTRO]
    Segmento:
      type: string
      enum: [LEVE, PESADA, AGRICOLA, INDUSTRIAL]
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string }
        empresa: { type: string, nullable: true }
        telefone: { type: string, nullable: true }
        perfil: { $ref: '#/components/schemas/Perfil' }
        status: { $ref: '#/components/schemas/StatusUsuario' }
        ultimoAcessoEm: { type: string, format: date-time, nullable: true }
        criadoEm: { type: string, format: date-time }
    DadosUsuario:
      type: object
      required: [nome, email, perfil, status]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
        empresa: { type: string, nullable: true }
        telefone: { type: string, nullable: true }
        perfil: { $ref: '#/components/schemas/Perfil' }
        status: { $ref: '#/components/schemas/StatusUsuario' }
    ProdutoResumo:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, example: '30205' }
        nome: { type: string }
        segmento: { $ref: '#/components/schemas/Segmento' }
    Produto:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, example: '30205' }
        nome: { type: string, example: Rolamento de rolos cônicos }
        segmento: { $ref: '#/components/schemas/Segmento' }
        categoria:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            nome: { type: string, example: Rolamentos de Roletes Cônicos }
        descricao: { type: string, nullable: true }
        aplicacoes: { type: string, nullable: true }
        diametroInternoMm: { type: number, nullable: true, example: 25 }
        diametroExternoMm: { type: number, nullable: true, example: 52 }
        larguraMm: { type: number, nullable: true, example: 16.25 }
        pesoKg: { type: number, nullable: true, example: 0.16 }
        imagemUrl: { type: string, nullable: true, example: '/api/produtos/3f1c2a9e-8b7d-4c6e-9f00-123456789abc/imagem?v=1793110566000' }
        ativo: { type: boolean }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    DadosProduto:
      type: object
      required: [codigo, nome, segmento]
      properties:
        codigo: { type: string, example: '30205' }
        nome: { type: string, example: Rolamento de rolos cônicos }
        segmento: { $ref: '#/components/schemas/Segmento' }
        categoriaId: { type: string, format: uuid, nullable: true }
        descricao: { type: string, nullable: true }
        aplicacoes: { type: string, nullable: true }
        diametroInternoMm: { type: number, nullable: true, example: 25 }
        diametroExternoMm: { type: number, nullable: true, example: 52 }
        larguraMm: { type: number, nullable: true, example: 16.25 }
        pesoKg: { type: number, nullable: true, example: 0.16 }
        ativo: { type: boolean, default: true }
        removerImagem: { type: boolean, default: false, description: Na edição, apaga a foto atual }
    Categoria:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, example: Rolamentos de Esferas }
        descricao: { type: string, nullable: true }
        totalProdutos: { type: integer, description: No portal, conta só peças ativas }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    DadosCategoria:
      type: object
      required: [nome]
      properties:
        nome: { type: string, example: Rolamentos de Esferas }
        descricao: { type: string, nullable: true }
    Documento:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        descricao: { type: string, nullable: true }
        tipo: { $ref: '#/components/schemas/TipoDocumento' }
        idioma: { type: string }
        visibilidade: { $ref: '#/components/schemas/Visibilidade' }
        publicado: { type: boolean }
        origem: { type: string, enum: [ARQUIVO, LINK] }
        arquivo:
          type: object
          nullable: true
          properties:
            nome: { type: string }
            mime: { type: string }
            tamanho: { type: integer }
        urlExterna: { type: string, nullable: true }
        capaUrl:
          type: string
          nullable: true
          description: Endereço da capa (GET /api/documentos/{id}/capa?v=...), ou null se não houver
          example: /api/documentos/3f1c2a9e-8b7d-4c6e-9f00-123456789abc/capa?v=1793117449838
        capaPersonalizada: { type: boolean, description: A capa foi enviada pelo admin (e não gerada do arquivo) }
        produtos:
          type: array
          items: { $ref: '#/components/schemas/ProdutoResumo' }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    DocumentoAdmin:
      allOf:
        - $ref: '#/components/schemas/Documento'
        - type: object
          properties:
            usuariosComAcesso:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  email: { type: string }
                  empresa: { type: string, nullable: true }
            totalVisualizacoes: { type: integer }
    PaginaDocumentos:
      type: object
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Documento' }
        total: { type: integer }
        pagina: { type: integer }
        porPagina: { type: integer }
        totalPaginas: { type: integer }
    DadosDocumento:
      type: object
      required: [titulo, tipo, visibilidade, origem]
      properties:
        titulo: { type: string, minLength: 3 }
        descricao: { type: string, nullable: true }
        tipo: { $ref: '#/components/schemas/TipoDocumento' }
        idioma: { type: string, enum: [pt-BR, es, en], default: pt-BR }
        visibilidade: { $ref: '#/components/schemas/Visibilidade' }
        publicado: { type: boolean, default: true }
        origem: { type: string, enum: [ARQUIVO, LINK] }
        urlExterna: { type: string, nullable: true, description: Obrigatório quando origem = LINK }
        produtoIds:
          type: array
          items: { type: string, format: uuid }
        usuarioIds:
          type: array
          description: Usuários com acesso (só vale quando visibilidade = RESTRITO)
          items: { type: string, format: uuid }
        removerCapa: { type: boolean, default: false, description: Apaga a capa enviada pelo admin e volta para a automática }
